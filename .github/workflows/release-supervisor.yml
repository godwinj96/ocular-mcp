name: Release supervisor binaries

# Cross-compiles the Go supervisor (packages/local-worker/supervisor) for
# every platform useocular's binary-resolver.ts supports, publishes them as
# GitHub Release assets, and commits the resulting SHA-256 checksums back
# into supervisor-checksums.json — the file binary-resolver.ts trusts as the
# pinned integrity source at download time. See
# docs/rules/13-local-worker-and-distribution.md §10.
#
# Trigger: push a tag matching supervisor-v* (e.g. supervisor-v0.1.0) once
# the Go source is ready to ship. The version in the tag must match the
# "version" field in supervisor-checksums.json.

on:
  push:
    tags:
      - 'supervisor-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - key: win32-x64
            goos: windows
            goarch: amd64
            ext: .exe
            ldflags: '-H windowsgui' # see docs/rules/13 §4 — a plain build flashes a console window
          - key: darwin-x64
            goos: darwin
            goarch: amd64
            ext: ''
            ldflags: ''
          - key: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ''
            ldflags: ''
          - key: linux-x64
            goos: linux
            goarch: amd64
            ext: ''
            ldflags: ''
    runs-on: ubuntu-latest
    outputs: {}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # No external dependencies (go.mod has no require block), so there's
          # no go.sum for actions/setup-go's module-cache key to hash — a
          # cache-dependency-path pointing at a nonexistent file fails the
          # step outright. Nothing to cache either way.
          cache: false
      - name: Build
        working-directory: packages/local-worker/supervisor
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0' # pure Go — no cgo, so a single ubuntu runner can cross-compile every target
        run: |
          set -euo pipefail
          out="ocular-supervisor${{ matrix.ext }}"
          if [ -n "${{ matrix.ldflags }}" ]; then
            go build -ldflags="${{ matrix.ldflags }}" -o "$out" .
          else
            go build -o "$out" .
          fi
          asset="${{ matrix.key }}-ocular-supervisor${{ matrix.ext }}"
          mv "$out" "$asset"
          sha256sum "$asset" > "$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: supervisor-${{ matrix.key }}
          path: packages/local-worker/supervisor/${{ matrix.key }}-ocular-supervisor*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List downloaded artifacts (diagnostic)
        run: ls -la artifacts/ || echo "no artifacts dir"
      - name: Assemble checksum manifest
        id: manifest
        continue-on-error: true
        run: node .github/scripts/assemble-supervisor-checksums.cjs > /tmp/manifest-output.log 2>&1
      - name: Publish diagnostic log on failure
        # TEMPORARY — remove once the manifest step is confirmed working.
        # api.github.com's job-logs endpoint 403s for unauthenticated
        # requests even on a public repo ("Must have admin rights"), so this
        # writes the real error to a file that IS readable unauthenticated
        # via raw.githubusercontent.com. Uses the Contents API directly
        # (not `git push`) — two prior attempts via git push silently failed
        # for a still-unknown reason (not branch protection — confirmed via
        # the API that main is unprotected) and, without log access, a git
        # push failure is exactly as undiagnosable as the thing it's meant
        # to diagnose. A single PUT call is a smaller surface to get wrong.
        if: steps.manifest.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "--- manifest step output ---"; cat /tmp/manifest-output.log; echo "--- artifacts dir ---"; ls -la artifacts/; } > /tmp/debug.log 2>&1
          content_b64=$(base64 -w0 /tmp/debug.log)
          http_code=$(curl -sS -o /tmp/put-response.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/.github/debug/last-manifest-error.log" \
            -d "{\"message\":\"chore(ci): capture manifest-step diagnostic log [skip ci]\",\"content\":\"${content_b64}\",\"branch\":\"main\"}")
          echo "Contents API PUT responded: ${http_code}"
          cat /tmp/put-response.json
      - name: Fail if manifest step failed
        if: steps.manifest.outcome == 'failure'
        run: |
          cat /tmp/manifest-output.log
          exit 1
      - name: Commit updated checksums
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/local-worker/supervisor-checksums.json
          git commit -m "chore(local-worker): pin supervisor checksums for ${GITHUB_REF_NAME}" || echo "No changes to commit"
          git push origin HEAD:main
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/*-ocular-supervisor*
          fail_on_unmatched_files: true
